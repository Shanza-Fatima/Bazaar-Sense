<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazaar-Sense</title>
  <meta name="description" content="An AI-powered shopping companion for Pakistani bazaars. Capture photos of items to get typical PKR prices, translations, and pronunciations.">
  <meta property="og:title" content="Bazaar-Sense">
  <meta property="og:description" content="An AI-powered shopping companion for Pakistani bazaars. Capture photos of items to get typical PKR prices, translations, and pronunciations.">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #0f766e; /* Deep Teal */
      --brand-accent: #d97706; /* Burnt Orange/Amber */
      --brand-deep: #134e4a;
      --soft-bg: #fdfbf7;
      --soft-rose: #fff1f2;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--soft-bg);
      color: var(--brand-deep);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      margin: 0;
      min-height: 100vh;
    }
    
    /* Animated Background Styling */
    .bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #fffcf5 0%, #fdfbf7 100%);
    }
    
    /* Blurred Background Objects */
    .bg-object {
      position: absolute;
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.1;
      will-change: transform;
      animation: float-object 40s infinite linear;
    }

    .obj-1 {
      top: -10%;
      left: -5%;
      width: 500px;
      height: 500px;
      background: var(--brand-primary);
      border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      animation-duration: 55s;
    }

    .obj-2 {
      bottom: -10%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: var(--brand-accent);
      border-radius: 50% 50% 30% 70% / 50% 50% 70% 30%;
      animation-duration: 70s;
      animation-delay: -15s;
    }

    .obj-3 {
      top: 30%;
      left: 60%;
      width: 350px;
      height: 350px;
      background: #0d9488;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      animation-duration: 45s;
      animation-delay: -25s;
    }

    .obj-4 {
      top: 60%;
      left: -10%;
      width: 450px;
      height: 450px;
      background: #be185d; /* Warm Rose */
      opacity: 0.05;
      border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%;
      animation-duration: 80s;
      animation-delay: -5s;
    }

    .obj-5 {
      top: -5%;
      right: 15%;
      width: 300px;
      height: 300px;
      background: #ca8a04; /* Darker Amber */
      opacity: 0.07;
      border-radius: 60% 40% 30% 70% / 70% 30% 50% 50%;
      animation-duration: 65s;
      animation-delay: -40s;
    }

    /* Floating Micro-Particles */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--brand-accent);
      border-radius: 50%;
      opacity: 0.2;
      filter: blur(1px);
      animation: drift-particle 20s infinite ease-in-out;
    }

    /* Floating Cultural Motifs */
    .motif {
      position: absolute;
      opacity: 0.06;
      filter: blur(3px);
      will-change: transform;
      animation: drift 80s infinite linear;
    }

    .motif-tile {
      width: 140px;
      height: 140px;
      border: 3px solid var(--brand-primary);
      transform: rotate(45deg);
    }

    @keyframes float-object {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      33% { transform: translate(80px, 120px) rotate(120deg) scale(1.15); }
      66% { transform: translate(-120px, 60px) rotate(240deg) scale(0.85); }
      100% { transform: translate(0, 0) rotate(360deg) scale(1); }
    }

    @keyframes drift {
      from { transform: translate(-20%, -20%) rotate(0deg); }
      to { transform: translate(120%, 120%) rotate(360deg); }
    }

    @keyframes drift-particle {
      0%, 100% { transform: translate(0, 0); opacity: 0.1; }
      50% { transform: translate(100px, -100px); opacity: 0.3; }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .elegant-shadow {
      box-shadow: 0 20px 50px -12px rgba(15, 118, 110, 0.08);
    }
    #root {
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .btn-elegant {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-elegant:active {
      transform: scale(0.96);
    }
    .text-gradient {
      background: linear-gradient(135deg, #0f766e, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div class="bg-canvas">
    <!-- Blurred Background "Objects" -->
    <div class="bg-object obj-1"></div>
    <div class="bg-object obj-2"></div>
    <div class="bg-object obj-3"></div>
    <div class="bg-object obj-4"></div>
    <div class="bg-object obj-5"></div>
    
    <!-- Fine Particles -->
    <div class="particle" style="top: 20%; left: 30%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 70%; left: 10%; animation-delay: -5s;"></div>
    <div class="particle" style="top: 40%; left: 80%; animation-delay: -10s;"></div>
    <div class="particle" style="top: 10%; left: 90%; animation-delay: -15s;"></div>
    
    <!-- Floating Motifs for added texture -->
    <div class="motif" style="top: 5%; left: 15%;"><div class="motif-tile"></div></div>
    <div class="motif" style="top: 65%; left: 75%; animation-delay: -20s;"><div class="motif-tile" style="border-radius: 50%; border-color: var(--brand-accent);"></div></div>
    <div class="motif" style="top: 35%; left: 45%; animation-delay: -40s;"><div class="motif-tile" style="transform: rotate(30deg); border-width: 2px;"></div></div>
    <div class="motif" style="top: 85%; left: 25%; animation-delay: -60s;"><div class="motif-tile" style="transform: rotate(60deg); border-color: #0d9488;"></div></div>
  </div>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
